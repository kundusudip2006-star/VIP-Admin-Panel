<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIP PANEL STORE</title>

<link rel="stylesheet" href="css/shop.css">

<style>
    html.auth-loading body {
        visibility: hidden;
    }
</style>

<script>
    document.documentElement.classList.add("auth-loading");
</script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="particles-js"></div>

<!-- Header -->

<header class="top-header">

<div class="left-header">

<button id="myOrdersBtn" class="myorder-btn">
<i class="fa-solid fa-box"></i>
<span>My Orders</span>
</button>

</div>

<div class="right-header">

<button class="support-btn"
onclick="window.location.href='contact.html'">
<i class="fa-brands fa-whatsapp"></i>
</button>

<button id="logoutBtn" class="logout-btn">
<i class="fa-solid fa-right-from-bracket"></i>
</button>

</div>

</header>

<!-- Hero Banner -->

<section class="hero-banner">

<div class="hero-content">

<h1>🔥 VIP PANEL STORE</h1>

<p>
Premium Accounts • Instant Delivery • Trusted Service
</p>

<button
onclick="window.scrollTo({top:700,behavior:'smooth'})">
🛒 Shop Now
</button>

</div>

</section>

<!-- Products -->

<div class="container">

<h2>Available Products</h2>

<div id="productList" class="products"></div>

</div>

<!-- Buy Modal -->

<div id="buyModal" class="modal">

<div class="modal-content">

<span class="close" id="closeModal">&times;</span>

<h2>Confirm Purchase</h2>

<p>
Product :
<b id="buyProductName"></b>
</p>

<p style="margin-top:15px;">
Total Price :
<b style="color:#00c853;font-size:22px;">
₹<span id="buyProductPrice">0</span>
</b>
</p>

<p id="loginUser"></p>

<button id="confirmBuyBtn">
<i class="fa-solid fa-credit-card"></i>
Proceed To Payment
</button>

</div>

</div>
<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

<script src="js/shop.js"></script>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="js/particles.js"></script>

</body>
</html>
