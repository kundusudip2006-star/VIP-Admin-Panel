<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Users - VIP Admin Panel</title>

    <!-- COMMON ADMIN CSS -->
    <link rel="stylesheet" href="css/admin.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


<!-- =====================================================
     DESKTOP SIDEBAR
     MOBILE = BOTTOM NAVIGATION
===================================================== -->

<div class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

        <h2>VIP PANEL</h2>

    </div>


    <ul>

        <!-- Dashboard -->

        <li>

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>

        </li>


        <!-- Users -->

        <li class="active">

            <a href="users.html">

                <i class="fa-solid fa-users"></i>

                <span>Users</span>

            </a>

        </li>


        <!-- Customers -->

        <li>

            <a href="customers.html">

                <i class="fa-solid fa-address-book"></i>

                <span>Customers</span>

            </a>

        </li>


        <!-- Products -->

        <li>

            <a href="products.html">

                <i class="fa-solid fa-box"></i>

                <span>Products</span>

            </a>

        </li>


        <!-- Orders -->

        <li>

            <a href="orders.html">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>Orders</span>

            </a>

        </li>


        <!-- Profile -->

        <li>

            <a href="profile.html">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </a>

        </li>


        <!-- Settings -->

        <li>

            <a href="settings.html">

                <i class="fa-solid fa-gear"></i>

                <span>Settings</span>

            </a>

        </li>


        <!-- Logout -->

        <li id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </li>

    </ul>

</div>



<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="main">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header>

        <div>

            <h1>Users</h1>

            <p class="page-subtitle">
                Manage admin panel users
            </p>

        </div>


        <div class="top-right">

            <input
                type="text"
                id="searchUser"
                placeholder="Search User..."
            >


            <div class="notification-wrapper">

                <i class="fa-solid fa-bell"></i>

                <span id="notificationCount">
                    0
                </span>


                <div
                    id="notificationBox"
                    class="notification-box"
                >

                    <h3>
                        Notifications
                    </h3>

                    <div id="notificationList">
                        No New Notifications
                    </div>

                </div>

            </div>


            <img
                src="https://i.pravatar.cc/60"
                alt="Profile"
            >

        </div>

    </header>



    <!-- =================================================
         USER ACTION BAR
    ================================================== -->

    <div class="user-action-bar">

        <input
            type="text"
            id="searchUserDesktop"
            placeholder="Search User..."
        >


        <button
            type="button"
            id="addUserBtn"
            class="add-user-btn"
        >

            <i class="fa-solid fa-user-plus"></i>

            <span>Add User</span>

        </button>

    </div>



    <!-- =================================================
         USER TABLE
    ================================================== -->

    <section class="table-section">

        <h2>
            User Management
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="userTable">

                    <tr>

                        <td
                            colspan="5"
                            class="loading"
                        >
                            Loading Users...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>



    <!-- =================================================
         ADD / EDIT USER MODAL
    ================================================== -->

    <div
        id="userModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- Close -->

            <span
                class="close"
                id="closeModal"
            >
                &times;
            </span>


            <!-- Modal Title -->

            <h2 id="modalTitle">
                Add User
            </h2>


            <!-- User Form -->

            <form id="userForm">


                <!-- Name -->

                <input
                    type="text"
                    id="userName"
                    placeholder="Full Name"
                    required
                >


                <!-- Email -->

                <input
                    type="email"
                    id="userEmail"
                    placeholder="Email"
                    required
                >


                <!-- Role -->

                <select id="userRole">

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Manager">
                        Manager
                    </option>

                    <option value="Staff">
                        Staff
                    </option>

                </select>


                <!-- Status -->

                <select id="userStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>


                <!-- Save -->

                <button
                    type="submit"
                    id="saveUserBtn"
                >
                    Save User
                </button>

            </form>

        </div>

    </div>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>


<!-- FIREBASE CONFIG -->

<script src="js/firebase.js"></script>


<!-- USERS JS -->

<script src="js/users.js"></script>



<!-- =====================================================
     SIDEBAR LOGOUT
===================================================== -->

<script>

const logoutBtn = document.getElementById("logoutBtn");


if (logoutBtn) {

    logoutBtn.addEventListener("click", async function () {

        const confirmLogout =
            confirm("Are you sure you want to logout?");


        if (!confirmLogout) {
            return;
        }


        try {

            await auth.signOut();

            window.location.href = "admin-login.html";

        }

        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed. Please try again."
            );

        }

    });

}

</script>


</body>

</html>
